<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Flood Alert System{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'floodapp/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px; /* To make space for navbar */
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'home' %}">Flood Alert 🌊</a>
    <div class="dropdown ms-auto">
      <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Menu
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{% url 'home' %}">Home</a></li>
        <li><a class="dropdown-item" href="{% url 'flood_form' %}">Flood Alert Form</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container mt-4">
    {% block content %}{% endblock %}
</main>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
